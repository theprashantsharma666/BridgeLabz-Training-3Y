<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creative Paragraph</title>
</head>
<body>
    <p>
        <strong>Learning HTML</strong> is an
        <em>interesting journey</em>.
        <mark>Practice every day</mark> to improve your skills.
        <br>
        <small>Keep learning and keep building!</small>
    </p>
</body>
</html>
