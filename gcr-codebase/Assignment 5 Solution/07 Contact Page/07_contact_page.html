<!DOCTYPE html>
<html>
<head>
    <title>Contact Page</title>
    <link rel="stylesheet" href="07_contact_page.css">
</head>
<body>

    <h1>Contact Me</h1>

    <form>
        <label>Name:</label>
        <input type="text" name="name">

        <label>Email:</label>
        <input type="email" name="email">

        <label>Subject:</label>
        <input type="text" name="subject">

        <label>Message:</label>
        <textarea name="message"></textarea>

        <button type="submit">Send Message</button>
    </form>

</body>
</html>
