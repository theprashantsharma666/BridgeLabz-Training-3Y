<!DOCTYPE html>
<html>
<head>
    <title>Complete Webpage</title>
    <link rel="stylesheet" href="10_complete_webpage.css">
</head>
<body>

    <header>
        <h1>My Website</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Welcome to My Website</h1>
    </section>

    <section id="about">
        <h2>About Me</h2>
        <div class="about">
            <p>I am a Computer Science student interested in technology and web development.</p>
            <img src="about.jpg" alt="About Me">
        </div>
    </section>

    <section id="services">
        <h2>Services</h2>

        <div class="services">
            <div>Web Development</div>
            <div>Data Analysis</div>
            <div>UI Design</div>
        </div>
    </section>

    <section id="contact">
        <h2>Contact</h2>

        <form>
            <input type="text" placeholder="Name">
            <input type="email" placeholder="Email">
            <textarea placeholder="Message"></textarea>
            <button>Send</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Prashant Sharma</p>
    </footer>

</body>
</html>
