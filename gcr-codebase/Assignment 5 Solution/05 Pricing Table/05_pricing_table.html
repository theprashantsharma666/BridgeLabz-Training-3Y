<!DOCTYPE html>
<html>
<head>
    <title>Pricing Table</title>
    <link rel="stylesheet" href="05_pricing_table.css">
</head>
<body>

    <h1>Pricing Plans</h1>

    <div class="plans">

        <div class="plan plan-1">
            <h2>Basic</h2>
            <p>₹199/Month</p>
            <ul>
                <li>5 GB Storage</li>
                <li>Email Support</li>
                <li>Basic Features</li>
            </ul>
            <a href="#">Choose Plan</a>
        </div>

        <div class="plan popular">
            <h2>Standard</h2>
            <p>₹399/Month</p>
            <ul>
                <li>20 GB Storage</li>
                <li>Priority Support</li>
                <li>More Features</li>
            </ul>
            <a href="#">Choose Plan</a>
        </div>

        <div class="plan plan-2">
            <h2>Premium</h2>
            <p>₹599/Month</p>
            <ul>
                <li>50 GB Storage</li>
                <li>24/7 Support</li>
                <li>All Features</li>
            </ul>
            <a href="#">Choose Plan</a>
        </div>

    </div>

</body>
</html>
