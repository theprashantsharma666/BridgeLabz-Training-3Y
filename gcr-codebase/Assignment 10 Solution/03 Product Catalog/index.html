<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="text-center p-4">
        <h1 class="fw-bold">Product Catalog</h1>
        <p class="lead">Choose your favorite products</p>
    </header>

    <main class="container">
        <div class="row g-4">
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card">
                    <img src="https://png.pngtree.com/png-vector/20250522/ourmid/pngtree-modern-laptop-computer-with-screen-open-technology-digital-device-png-image_16345445.png" class="card-img-top" alt="Laptop">

                    <div class="card-body text-center">
                        <h5 class="card-title">Laptop</h5>
                        <p class="card-text">₹55,000</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card">
                    <img src="https://www.boat-lifestyle.com/cdn/shop/products/main2_b66dce6b-710d-49cb-9d1c-2bc8c9c0ab15_600x.png?v=1645698328" class="card-img-top" alt="Headphones">

                    <div class="card-body text-center">
                        <h5 class="card-title">Headphones</h5>
                        <p class="card-text">₹2,500</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT0f56q_d8MElmnJOw2yFEQ-DnQRPZ8Dxcj-saaJLs-fKcx8HnGtBpUth0&s=10" class="card-img-top" alt="Smart Watch">

                    <div class="card-body text-center">
                        <h5 class="card-title">Smart Watch</h5>
                        <p class="card-text">₹4,000</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card">
                    <img src="https://image01-in.oneplus.net/media/202604/29/e91e06a8fb301c6558fcec2cf13a864a.png?x-amz-process=image/format,webp/quality,Q_80" class="card-img-top" alt="Mobile Phone">

                    <div class="card-body text-center">
                        <h5 class="card-title">Mobile Phone</h5>
                        <p class="card-text">₹25,000</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center p-4 mt-5 bg-dark text-white">
        <p class="mb-0">© 2026 Product Catalog</p>
    </footer>

</body>
</html>
