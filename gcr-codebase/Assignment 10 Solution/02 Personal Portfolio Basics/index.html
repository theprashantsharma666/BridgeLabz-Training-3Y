<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light text-dark">

    <header class="text-center p-5">
        <h1 class="fw-bold">Prashant Sharma</h1>
        <p class="lead">Computer Science Engineer | AI & Data Science</p>
    </header>

    <main class="container text-center">
        <section class="mb-3">
            <img src="https://picsum.photos/180" alt="Profile Image" class="img-fluid rounded-circle profile-image">
            <h2 class="mt-4">About Me</h2>
            <p>I am interested in software development, data analysis and building useful technology projects.</p>

            <div class="mt-4">
                <a href="#" class="btn btn-primary me-2">Hire Me</a>
                <a href="#" class="btn btn-dark">Download CV</a>
            </div>

        </section>

        <section class="contact mt-4 mb-3">
            <h2 class="mb-3">Contact Me</h2>
            <form>
                <input type="text" class="form-control mb-3" placeholder="Your Name">
                <input type="email" class="form-control mb-3" placeholder="Your Email">
                <textarea class="form-control mb-3" rows="4" placeholder="Your Message"></textarea>

                <button type="submit" class="btn btn-success">
                    Send Message
                </button>
            </form>
        </section>
    </main>

    <footer class="text-center p-3 mt-4">
        <p>© 2026 Prashant Sharma</p>
    </footer>
</body>
</html>
