<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="text-center p-4">
        <h1 class="fw-bold">Task Tracker <span class="badge bg-primary">4</span></h1>
        <p class="lead">Manage your daily tasks</p>
    </header>

    <main class="container">

        <section>
            <div class="list-group">
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    Complete HTML Assignment
                    <span class="badge bg-danger">High</span>
                </div>

                <div class="list-group-item d-flex justify-content-between align-items-center">
                    Practice Java DSA
                    <span class="badge bg-warning text-dark">Medium</span>
                </div>

                <div class="list-group-item d-flex justify-content-between align-items-center">
                    Read Bootstrap Notes
                    <span class="badge bg-success">Low</span>
                </div>

                <div class="list-group-item d-flex justify-content-between align-items-center">
                    Update GitHub Repository
                    <span class="badge bg-danger">High</span>
                </div>

            </div>
        </section>

        <section class="text-center mt-4">
            <button class="btn btn-success">Completed <span class="badge bg-light text-dark">2</span>
            </button>
        </section>

    </main>

    <footer class="text-center p-3 mt-5 bg-dark text-white">
        <p class="mb-0">© 2026 Task Tracker</p>
    </footer>
</body>
</html>
