<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>CSS Tooltip</h1>

    <div class="container">
        <div class="tooltip">
            Home
            <span class="tooltip-text">Go to Home</span>
        </div>

        <div class="tooltip">
            Profile
            <span class="tooltip-text">View Profile</span>
        </div>

        <div class="tooltip">
            Contact
            <span class="tooltip-text">Contact Us</span>
        </div>
    </div>
</body>
</html>
