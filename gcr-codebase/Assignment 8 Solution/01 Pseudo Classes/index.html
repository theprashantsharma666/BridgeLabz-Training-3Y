<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo Classes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Pseudo Classes</h1>

    <div class="container">
        <div>
            <a href="#">Hover over this link</a>
            <p>Hover changes the link color.</p>
        </div>

        <div>
            <button>Click this button</button>
            <p>Focus changes the button background.</p>
        </div>

        <div>
            <ul>
                <li>First Item</li>
                <li>Second Item</li>
                <li>Third Item</li>
            </ul>
            <p>nth-child changes the second item.</p>
        </div>

        <div>
            <button class="active-button">Active Button</button>
            <p>Active changes the button color while clicking.</p>
        </div>
    </div>
</body>
</html>
