<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Image Filter Gallery</h1>
    </header>

    <main>
        <section class="gallery">

            <figure>
                <img class="blur" src="https://picsum.photos/300/200?1" alt="Nature">
                <figcaption>Blur</figcaption>
            </figure>

            <figure>
                <img class="gray" src="https://picsum.photos/300/200?2" alt="Mountain">
                <figcaption>Grayscale</figcaption>
            </figure>

            <figure>
                <img class="sepia" src="https://picsum.photos/300/200?3" alt="Forest">
                <figcaption>Sepia</figcaption>
            </figure>

            <figure>
                <img class="bright" src="https://picsum.photos/300/200?4" alt="Beach">
                <figcaption>Brightness</figcaption>
            </figure>

            <figure>
                <img class="contrast" src="https://picsum.photos/300/200?5" alt="City">
                <figcaption>Contrast</figcaption>
            </figure>

            <figure>
                <img class="hue" src="https://picsum.photos/300/200?6" alt="Road">
                <figcaption>Hue Rotate</figcaption>
            </figure>

        </section>
    </main>
</body>
</html>
