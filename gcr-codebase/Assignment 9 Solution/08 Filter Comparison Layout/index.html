<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Filter Comparison</h1>

    <section class="comparison">

        <div class="image-box">
            <img src="https://picsum.photos/400/300?1" alt="Original Image">
            <h2>Original Image</h2>
        </div>

        <div class="image-box">
            <img class="filtered" src="https://picsum.photos/400/300?2" alt="Filtered Image">
            <h2>Filtered Image</h2>
        </div>

    </section>
</body>
</html>
