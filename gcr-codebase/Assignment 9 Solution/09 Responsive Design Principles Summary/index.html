<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Design Principles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Responsive Design Principles</h1>

    <section class="principles">

        <div class="box">
            <h2>Fluid Layouts</h2>
            <p>Layouts adjust their size according to the screen.</p>
            <code>width: 100%;</code>
        </div>

        <div class="box">
            <h2>Flexible Media</h2>
            <p>Images and media adjust to fit different screen sizes.</p>
            <code>max-width: 100%;</code>
        </div>

        <div class="box">
            <h2>Breakpoints</h2>
            <p>Breakpoints change the layout at different screen sizes.</p>
            <code>@media (max-width: 600px)</code>
        </div>

    </section>
</body>
</html>
