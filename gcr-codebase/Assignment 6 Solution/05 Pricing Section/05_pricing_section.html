<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="05_pricing_section.css">
</head>
<body>
    <h1>Pricing Plans</h1>

    <div class="pricing">

        <div class="card">
            <h2>Basic</h2>
            <h3>₹199</h3>
            <p>1 User</p>
            <p>5 GB Storage</p>
            <button>Choose</button>
        </div>

        <div class="card">
            <h2>Standard</h2>
            <h3>₹399</h3>
            <p>5 Users</p>
            <p>20 GB Storage</p>
            <button>Choose</button>
        </div>

        <div class="card">
            <h2>Premium</h2>
            <h3>₹599</h3>
            <p>10 Users</p>
            <p>50 GB Storage</p>
            <button>Choose</button>
        </div>

    </div>
</body>
</html>
