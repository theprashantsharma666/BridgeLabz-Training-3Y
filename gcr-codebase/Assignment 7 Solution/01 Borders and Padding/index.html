<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Borders and Padding</h1>

    <div class="container">

        <div class="box solid">
            Solid Border
        </div>

        <div class="box dashed">
            Dashed Border
        </div>

        <div class="box double">
            Double Border
        </div>

        <div class="box groove">
            Groove Border
        </div>
    </div>
</body>
</html>
