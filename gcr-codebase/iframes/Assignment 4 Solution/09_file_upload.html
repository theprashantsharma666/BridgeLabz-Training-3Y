<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload</title>
</head>
<body>
    <h1>File Upload</h1>

    <form>
        <input type="file" accept=".jpg, .png">

        <p>Only JPG and PNG files are allowed.</p>

        <input type="submit" value="Upload">
    </form>
</body>
</html>
