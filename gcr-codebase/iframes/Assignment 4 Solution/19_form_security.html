<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Security</title>
</head>
<body>
    <h1>Secure Form</h1>

    <form>
        <input type="text" placeholder="Username" required>
        <br><br>

        <input type="password" placeholder="Password" required>
        <br><br>

        <input type="submit" value="Login">
    </form>

    <p>
        Turning off autocomplete can improve security by preventing the browser
        from automatically storing or filling sensitive information.
    </p>
</body>
</html>
