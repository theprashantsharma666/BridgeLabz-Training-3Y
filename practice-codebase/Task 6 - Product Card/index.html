<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>product-card</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="product-card">

    <div class="product-image">
        <img src="product.jpg" alt="Premium Running Shoes">
        <span class="discount">20% OFF</span>
        <button class="wishlist">♡</button>
    </div>

    <div class="product-details">
        <span class="category">SPORTS SHOES</span>
        <h2>Premium Running Shoes</h2>
        <div class="rating">
            <span class="stars">★★★★★</span>
            <span class="reviews">(120)</span>
        </div>

        <div class="price">
            <span class="current-price">₹1,999</span>
            <span class="old-price">₹2,499</span>
        </div>

        <button class="add-cart">Add to Cart</button>
    </div>

</div>

</body>
</html>
